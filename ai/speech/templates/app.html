<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Speech Transcriber</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-glow: rgba(99, 102, 241, 0.5);
            --lang-badge-bg: rgba(56, 189, 248, 0.15);
            --lang-badge-text: #38bdf8;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Ambient background glow */
        body::before {
            content: '';
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
        }

        .header {
            margin-top: 4rem;
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeDown 0.8s ease-out;
        }

        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            margin: 0;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 24px rgba(165, 180, 252, 0.2);
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-top: 0.5rem;
        }

        .mic-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 1rem;
            padding: 10px 20px;
            background: rgba(239, 68, 68, 0.1); /* Red for stopped */
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 30px;
            color: #f87171;
            font-weight: 500;
            font-size: 0.95rem;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.1);
            transition: all 0.3s ease;
        }

        .mic-status.listening {
            background: rgba(16, 185, 129, 0.1); /* Green for listening */
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #34d399;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #f87171;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .mic-status.listening .pulse-dot {
            background-color: #34d399;
            animation: pulse 1.5s infinite;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        button {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-start {
            background: #6366f1;
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-start:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        .btn-stop {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-stop:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .transcription-container {
            width: 90%;
            max-width: 900px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            min-height: 400px;
            max-height: 60vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        /* Custom scrollbar */
        .transcription-container::-webkit-scrollbar {
            width: 8px;
        }
        .transcription-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .transcription-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .transcription-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .empty-state {
            margin: auto;
            color: var(--text-muted);
            text-align: center;
            font-size: 1.1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            opacity: 0.5;
        }

        .message-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.5rem;
            animation: fadeIn 0.5s ease-out forwards;
            transform-origin: top left;
            transition: transform 0.2s, background 0.2s;
        }

        .message-card:hover {
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-2px);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .lang-badge {
            background: var(--lang-badge-bg);
            color: var(--lang-badge-text);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .timestamp {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .message-text {
            font-size: 1.4rem;
            line-height: 1.6;
            color: #fff;
            /* Ensures complex unicode scripts (Tamil/Hindi) render beautifully */
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        /* Animations */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        /* Add spinner animation */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Speech AI</h1>
        <p>Push-to-Talk Transcription</p>
        <div class="mic-status" id="mic-status">
            <div class="pulse-dot"></div>
            <span id="status-text">Microphone Offline</span>
        </div>
        <div class="controls">
            <button class="btn-start" onclick="startMic()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                Start Listening
            </button>
            <button class="btn-stop" onclick="stopMic()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
                Stop & Transcribe
            </button>
        </div>
    </div>

    <div class="transcription-container" id="transcription-box">
        <div class="empty-state" id="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
            </svg>
            <span id="instruction-text">Click Start and speak...</span>
        </div>
        <div class="spinner" id="loading-spinner"></div>
        <div id="results-area"></div>
    </div>

    <script>
        const transcriptionBox = document.getElementById('transcription-box');
        const resultsArea = document.getElementById('results-area');
        const emptyState = document.getElementById('empty-state');
        const instructionText = document.getElementById('instruction-text');
        const spinner = document.getElementById('loading-spinner');

        // Use standard Javascript API to get the human-readable language name for ANY language code
        const langNames = new Intl.DisplayNames(['en'], { type: 'language' });

        function startMic() {
            // Clear previous results
            resultsArea.innerHTML = '';
            spinner.style.display = 'none';
            emptyState.style.display = 'flex';
            instructionText.innerText = "Recording... Speak freely!";

            fetch('/start', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    const status = document.getElementById('mic-status');
                    const statusText = document.getElementById('status-text');
                    status.classList.add('listening');
                    statusText.innerText = "Listening to Microphone";
                });
        }

        function stopMic() {
            const status = document.getElementById('mic-status');
            const statusText = document.getElementById('status-text');
            status.classList.remove('listening');
            statusText.innerText = "Microphone Offline";
            
            // Show processing spinner
            emptyState.style.display = 'none';
            spinner.style.display = 'block';

            fetch('/stop', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    spinner.style.display = 'none';
                    
                    if (data.text) {
                        let fullLangName = data.language ? data.language.toUpperCase() : 'Unknown';
                        try {
                            // Try to get the pretty name for any of the 99 languages
                            fullLangName = langNames.of(data.language) || fullLangName;
                        } catch (e) {}
                        const now = new Date();
                        const timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});

                        const card = document.createElement('div');
                        card.className = 'message-card';
                        card.innerHTML = `
                            <div class="message-header">
                                <span class="lang-badge">${fullLangName}</span>
                                <span class="timestamp">${timeStr}</span>
                            </div>
                            <div class="message-text">${data.text}</div>
                        `;
                        resultsArea.appendChild(card);
                    } else {
                        emptyState.style.display = 'flex';
                        instructionText.innerText = "No speech detected. Try again!";
                    }
                })
                .catch(err => {
                    spinner.style.display = 'none';
                    emptyState.style.display = 'flex';
                    instructionText.innerText = "Error processing audio.";
                    console.error(err);
                });
        }
    </script>
</body>
</html>
